[build]
  publish = "."
  # Hashes JS/CSS into /assets/* and rewrites index.html. No bundler.
  # Skipped when CONTEXT=dev so local `netlify dev` does not dirty the tree.
  command = "node netlify/fingerprint-assets.js"
  functions = "netlify/functions"

# Bundle index.html with the creator-og / club-og functions so they can
# read and rewrite the meta tags per creator / club.
[functions."creator-og"]
  included_files = ["index.html"]
[functions."club-og"]
  included_files = ["index.html"]
[functions."news-article"]
  included_files = ["index.html"]
[functions."rankings"]
  included_files = ["index.html"]
[functions."discover"]
  included_files = ["index.html"]
[functions."news"]
  included_files = ["index.html"]
[functions."become-a-creator"]
  included_files = ["index.html"]
[functions."home"]
  included_files = ["index.html"]
[functions."streamwall"]
  included_files = ["index.html"]
[functions."tools-generator"]
  included_files = ["index.html"]
[functions."tools"]
  included_files = ["index.html"]
[functions."submit"]
  included_files = ["index.html"]
[functions."community-features"]
  included_files = ["index.html"]
[functions."not-found"]
  included_files = ["index.html"]
[functions."privacy"]
  included_files = ["index.html"]
[functions."cookies"]
  included_files = ["index.html"]
[functions."private-pages"]
  included_files = ["index.html"]

# ── Scheduled functions ──────────────────────────────────────────────────
# Baseline live-check: every 30 minutes — safety net for anything the
# fixture-aware trigger below doesn't cover (postponed/unlisted streams).
[functions."live-check"]
schedule = "*/30 * * * *"

# Daily fixtures sync from football-data.org — populates frfc_fixtures for
# every league/competition FanReactionsFC covers.
[functions."fixtures-sync"]
schedule = "30 4 * * *"

# Fixture-aware live-check: every 5 minutes, fires ~5 minutes before kickoff
# for creators tied to the two clubs playing (World Cup fixtures check every
# creator instead, since watchalongs aren't nation-limited in practice). See
# live-check-fixtures-background.js for why it does a real playlist-head
# refresh instead of just re-checking a stale ID — this replaces the old
# blanket-hours live-check-peak.js. Background function (up to 15 min) since
# a broad World Cup check touches all ~265 creators.
[functions."live-check-fixtures-background"]
schedule = "*/5 * * * *"

# Daily GDPR retention cleanup — deletes contact messages / creator reports
# past the retention window documented in /privacy (see retention-cleanup.js).
[functions."retention-cleanup"]
schedule = "0 5 * * *"

# Dynamic sitemap generated from the Supabase creator list.
[[redirects]]
  from = "/sitemap.xml"
  to = "/.netlify/functions/sitemap"
  status = 200

# Trailing-slash variants for SPA-only routes. These do NOT 301 to the
# bare path: confirmed live (deploy preview for this exact change) that
# a 301-to-self chain here — /contact/ → /contact, etc. — reproduces the
# same self-redirect bug /rankings had. Same fix as /rankings/, /discover/,
# /news/, /become-a-creator/ below: rewrite straight to the final target,
# same as the bare path, with force=true.
[[redirects]]
  from = "/contact/"
  to = "/index.html"
  status = 200
  force = true
[[redirects]]
  from = "/privacy/"
  to = "/.netlify/functions/privacy"
  status = 200
  force = true
[[redirects]]
  from = "/cookies/"
  to = "/.netlify/functions/cookies"
  status = 200
  force = true
[[redirects]]
  from = "/terms/"
  to = "/index.html"
  status = 200
  force = true
[[redirects]]
  from = "/account/"
  to = "/.netlify/functions/private-pages"
  status = 200
  force = true
[[redirects]]
  from = "/newsletter/preferences/"
  to = "/index.html"
  status = 200
  force = true
[[redirects]]
  from = "/newsletter/unsubscribe/"
  to = "/index.html"
  status = 200
  force = true

# Homepage — force = true so index.html in publish/ does not win
# (same Asset pretty-URL trap that made GET /rankings 301 to itself).
# Canonical is trailing-slash `/`. Do not 301 `/` to a slash-less host
# path from this rule or from home.js (that loops).
[[redirects]]
  from = "/"
  to = "/.netlify/functions/home"
  status = 200
  force = true

# Prerendered index pages — unique head + visible body in raw HTML.
# force = true so the rewrite beats Asset pretty URLs (without it, GET
# /rankings 301'd to itself and crawlers never reached the function).
# Trailing-slash variants also rewrite here so the function can 301.
[[redirects]]
  from = "/rankings"
  to = "/.netlify/functions/rankings"
  status = 200
  force = true
[[redirects]]
  from = "/rankings/"
  to = "/.netlify/functions/rankings"
  status = 200
  force = true
[[redirects]]
  from = "/discover"
  to = "/.netlify/functions/discover"
  status = 200
  force = true
[[redirects]]
  from = "/discover/"
  to = "/.netlify/functions/discover"
  status = 200
  force = true
[[redirects]]
  from = "/become-a-creator"
  to = "/.netlify/functions/become-a-creator"
  status = 200
  force = true
[[redirects]]
  from = "/become-a-creator/"
  to = "/.netlify/functions/become-a-creator"
  status = 200
  force = true
[[redirects]]
  from = "/news"
  to = "/.netlify/functions/news"
  status = 200
  force = true
[[redirects]]
  from = "/news/"
  to = "/.netlify/functions/news"
  status = 200
  force = true

# Monthly Verified stats card. Must sit above the /creators/* splat or
# /creators/:slug/stats is swallowed by creator-og.
[functions."creator-stats"]
  included_files = ["index.html", "js/lib/verified.js"]

[[redirects]]
  from = "/creators/*/stats"
  to = "/.netlify/functions/creator-stats"
  status = 200
[[redirects]]
  from = "/creators/*/stats/"
  to = "/.netlify/functions/creator-stats"
  status = 200

# Per-creator SSR — unique H1/body/ProfilePage JSON-LD; trailing slash 301s
# and unknown slugs 404 inside the function.
[[redirects]]
  from = "/creators/*"
  to = "/.netlify/functions/creator-og"
  status = 200
[[redirects]]
  from = "/creators"
  to = "/discover"
  status = 301

# Per-club SSR — hyphenated slugs, 301s from spaced/cased URLs, ItemList +
# SportsTeam schema. Unknown clubs are HTTP 404.
[[redirects]]
  from = "/clubs/*"
  to = "/.netlify/functions/club-og"
  status = 200
[[redirects]]
  from = "/clubs"
  to = "/discover"
  status = 301

# Legacy directory URL. The creator index is /discover. force = true so
# this wins over the unknown-route 404 below.
[[redirects]]
  from = "/directory"
  to = "/discover"
  status = 301
  force = true
[[redirects]]
  from = "/directory/"
  to = "/discover"
  status = 301
  force = true

# First-party proxy for article cover images (see article-cover.js) — X's
# crawler refuses images served directly from Supabase Storage because of
# the X-Robots-Tag: none header it sends on every object.
[[redirects]]
  from = "/article-covers/*"
  to = "/.netlify/functions/article-cover"
  status = 200

# Server-rendered news articles. /news (the hub) is handled above.
[[redirects]]
  from = "/news/*"
  to = "/.netlify/functions/news-article"
  status = 200

# Keep internal dev docs off the production domain (they still live in the
# repo/GitHub, just shouldn't be served from fanreactionsfc.com).
# force = true so the rule beats the real file that exists in publish dir.
[[redirects]]
  from = "/docs/*"
  to = "/index.html"
  status = 404
  force = true
[[redirects]]
  from = "/README.md"
  to = "/index.html"
  status = 404
  force = true
[[redirects]]
  from = "/CHANGES.md"
  to = "/index.html"
  status = 404
  force = true

# Known client-only SPA routes — still 200 the shell so in-app navigation
# and signed-in pages keep working. Everything else is a real HTTP 404
# (see not-found.js). Files in publish/ are served first by Netlify.
#
# force = true on contact/terms: confirmed live these routes 301'd to
# themselves without it — the same Asset pretty-URL trap /rankings had.
# /privacy and /cookies are prerendered. /account and /admin are a
# noindex shell (private-pages.js) so the SPA can still boot for a
# signed-in visitor. force = true so that shell wins over index.html.
[[redirects]]
  from = "/contact"
  to = "/index.html"
  status = 200
  force = true
[[redirects]]
  from = "/privacy"
  to = "/.netlify/functions/privacy"
  status = 200
  force = true
[[redirects]]
  from = "/cookies"
  to = "/.netlify/functions/cookies"
  status = 200
  force = true
[[redirects]]
  from = "/terms"
  to = "/index.html"
  status = 200
  force = true
[[redirects]]
  from = "/account"
  to = "/.netlify/functions/private-pages"
  status = 200
  force = true
[[redirects]]
  from = "/newsletter/preferences"
  to = "/index.html"
  status = 200
  force = true
[[redirects]]
  from = "/newsletter/unsubscribe"
  to = "/index.html"
  status = 200
  force = true
[[redirects]]
  from = "/admin"
  to = "/.netlify/functions/private-pages"
  status = 200
  force = true
[[redirects]]
  from = "/admin/"
  to = "/.netlify/functions/private-pages"
  status = 200
  force = true
[[redirects]]
  from = "/admin/*"
  to = "/.netlify/functions/private-pages"
  status = 200
  force = true
[[redirects]]
  from = "/manage/*"
  to = "/index.html"
  status = 200

# Prerendered utility pages — same Asset pretty-URL trap as /rankings had
# (confirmed live: both self-301'd without force=true). Real H1/canonical/
# body for crawlers; the SPA still hydrates #app with the interactive tool.
# Does NOT touch js/generator.js or the streamwall client rendering code —
# this is a separate, read-only SSR snapshot alongside them.
[[redirects]]
  from = "/streamwall"
  to = "/.netlify/functions/streamwall"
  status = 200
  force = true
[[redirects]]
  from = "/streamwall/"
  to = "/.netlify/functions/streamwall"
  status = 200
  force = true
[[redirects]]
  from = "/tools/generator"
  to = "/.netlify/functions/tools-generator"
  status = 200
  force = true
[[redirects]]
  from = "/tools/generator/"
  to = "/.netlify/functions/tools-generator"
  status = 200
  force = true

# /tools is the index for the description generator and Streamwall.
# Same Asset pretty-URL trap as /tools/generator, so force = true.
# Trailing slash rewrites here so tools.js can 301 to /tools.
[[redirects]]
  from = "/tools"
  to = "/.netlify/functions/tools"
  status = 200
  force = true
[[redirects]]
  from = "/tools/"
  to = "/.netlify/functions/tools"
  status = 200
  force = true

# Creator submission form. Previously rewritten to index.html, so the
# response was the homepage shell (home H1 + canonical /) until JS ran.
# submit.js renders the form; the SPA still hydrates the interactive one.
[[redirects]]
  from = "/submit"
  to = "/.netlify/functions/submit"
  status = 200
  force = true
[[redirects]]
  from = "/submit/"
  to = "/.netlify/functions/submit"
  status = 200
  force = true

# /community/features didn't self-redirect, but it fell through to the
# raw homepage shell (wrong H1, "Loading..." subtitle, canonical pointing
# at "/") since there was no dedicated rewrite — same fix as above, minus
# the redirect-loop cause. /community/features/:id (individual requests)
# keeps the plain SPA shell; only the list page is prerendered.
[[redirects]]
  from = "/community/features"
  to = "/.netlify/functions/community-features"
  status = 200
  force = true
[[redirects]]
  from = "/community/features/*"
  to = "/index.html"
  status = 200

# Unknown routes — HTTP 404, not 200 + homepage canonical.
[[redirects]]
  from = "/*"
  to = "/.netlify/functions/not-found"
  status = 200

# Fingerprinted JS/CSS (netlify/fingerprint-assets.js) can be cached for a
# year: the hash is in the filename, so the URL's bytes never change.
# Unfingerprinted /js and /css stay must-revalidate so a missed reference
# cannot be pinned to the wrong deploy. HTML that is a static file
# revalidates too; function HTML sets the same Cache-Control itself.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
