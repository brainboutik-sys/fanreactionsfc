[build]
  publish = "."
  functions = "netlify/functions"

# Bundle index.html with the creator-og / club-og functions so they can
# read and rewrite the meta tags per creator / club.
[functions."creator-og"]
  included_files = ["index.html"]
[functions."club-og"]
  included_files = ["index.html"]
[functions."news-article"]
  included_files = ["index.html"]
[functions."rankings"]
  included_files = ["index.html"]
[functions."discover"]
  included_files = ["index.html"]
[functions."news-hub"]
  included_files = ["index.html"]
[functions."become-a-creator"]
  included_files = ["index.html"]
[functions."not-found"]
  included_files = ["index.html"]

# ── Scheduled functions ──────────────────────────────────────────────────
# Baseline live-check: every 30 minutes — safety net for anything the
# fixture-aware trigger below doesn't cover (postponed/unlisted streams).
[functions."live-check"]
schedule = "*/30 * * * *"

# Daily fixtures sync from football-data.org — populates frfc_fixtures for
# every league/competition FanReactionsFC covers.
[functions."fixtures-sync"]
schedule = "30 4 * * *"

# Fixture-aware live-check: every 5 minutes, fires ~5 minutes before kickoff
# for creators tied to the two clubs playing (World Cup fixtures check every
# creator instead, since watchalongs aren't nation-limited in practice). See
# live-check-fixtures-background.js for why it does a real playlist-head
# refresh instead of just re-checking a stale ID — this replaces the old
# blanket-hours live-check-peak.js. Background function (up to 15 min) since
# a broad World Cup check touches all ~265 creators.
[functions."live-check-fixtures-background"]
schedule = "*/5 * * * *"

# Daily GDPR retention cleanup — deletes contact messages / creator reports
# past the retention window documented in /privacy (see retention-cleanup.js).
[functions."retention-cleanup"]
schedule = "0 5 * * *"

# Dynamic sitemap generated from the Supabase creator list.
[[redirects]]
  from = "/sitemap.xml"
  to = "/.netlify/functions/sitemap"
  status = 200

# Trailing-slash 301s for the prerendered index routes (functions also
# 301, but matching here keeps the request off the function when possible).
[[redirects]]
  from = "/rankings/"
  to = "/rankings"
  status = 301
[[redirects]]
  from = "/discover/"
  to = "/discover"
  status = 301
[[redirects]]
  from = "/news/"
  to = "/news"
  status = 301
[[redirects]]
  from = "/become-a-creator/"
  to = "/become-a-creator"
  status = 301
[[redirects]]
  from = "/submit/"
  to = "/submit"
  status = 301
[[redirects]]
  from = "/contact/"
  to = "/contact"
  status = 301
[[redirects]]
  from = "/privacy/"
  to = "/privacy"
  status = 301
[[redirects]]
  from = "/cookies/"
  to = "/cookies"
  status = 301
[[redirects]]
  from = "/terms/"
  to = "/terms"
  status = 301
[[redirects]]
  from = "/streamwall/"
  to = "/streamwall"
  status = 301
[[redirects]]
  from = "/tools/generator/"
  to = "/tools/generator"
  status = 301
[[redirects]]
  from = "/account/"
  to = "/account"
  status = 301

# Prerendered index pages — unique head + visible body in raw HTML.
[[redirects]]
  from = "/rankings"
  to = "/.netlify/functions/rankings"
  status = 200
[[redirects]]
  from = "/discover"
  to = "/.netlify/functions/discover"
  status = 200
[[redirects]]
  from = "/become-a-creator"
  to = "/.netlify/functions/become-a-creator"
  status = 200
[[redirects]]
  from = "/news"
  to = "/.netlify/functions/news-hub"
  status = 200

# Per-creator SSR — unique H1/body/ProfilePage JSON-LD; trailing slash 301s
# and unknown slugs 404 inside the function.
[[redirects]]
  from = "/creators/*"
  to = "/.netlify/functions/creator-og"
  status = 200
[[redirects]]
  from = "/creators"
  to = "/discover"
  status = 301

# Per-club SSR — hyphenated slugs, 301s from spaced/cased URLs, ItemList +
# SportsTeam schema. Unknown clubs are HTTP 404.
[[redirects]]
  from = "/clubs/*"
  to = "/.netlify/functions/club-og"
  status = 200
[[redirects]]
  from = "/clubs"
  to = "/discover"
  status = 301

# First-party proxy for article cover images (see article-cover.js) — X's
# crawler refuses images served directly from Supabase Storage because of
# the X-Robots-Tag: none header it sends on every object.
[[redirects]]
  from = "/article-covers/*"
  to = "/.netlify/functions/article-cover"
  status = 200

# Server-rendered news articles. /news (the hub) is handled above.
[[redirects]]
  from = "/news/*"
  to = "/.netlify/functions/news-article"
  status = 200

# Keep internal dev docs off the production domain (they still live in the
# repo/GitHub, just shouldn't be served from fanreactionsfc.com).
# force = true so the rule beats the real file that exists in publish dir.
[[redirects]]
  from = "/docs/*"
  to = "/index.html"
  status = 404
  force = true
[[redirects]]
  from = "/README.md"
  to = "/index.html"
  status = 404
  force = true
[[redirects]]
  from = "/CHANGES.md"
  to = "/index.html"
  status = 404
  force = true

# Known client-only SPA routes — still 200 the shell so in-app navigation
# and signed-in pages keep working. Everything else is a real HTTP 404
# (see not-found.js). Files in publish/ are served first by Netlify.
[[redirects]]
  from = "/submit"
  to = "/index.html"
  status = 200
[[redirects]]
  from = "/contact"
  to = "/index.html"
  status = 200
[[redirects]]
  from = "/privacy"
  to = "/index.html"
  status = 200
[[redirects]]
  from = "/cookies"
  to = "/index.html"
  status = 200
[[redirects]]
  from = "/terms"
  to = "/index.html"
  status = 200
[[redirects]]
  from = "/streamwall"
  to = "/index.html"
  status = 200
[[redirects]]
  from = "/tools/generator"
  to = "/index.html"
  status = 200
[[redirects]]
  from = "/account"
  to = "/index.html"
  status = 200
[[redirects]]
  from = "/admin"
  to = "/index.html"
  status = 200
[[redirects]]
  from = "/admin/*"
  to = "/index.html"
  status = 200
[[redirects]]
  from = "/manage/*"
  to = "/index.html"
  status = 200
[[redirects]]
  from = "/community/features"
  to = "/index.html"
  status = 200
[[redirects]]
  from = "/community/features/*"
  to = "/index.html"
  status = 200

# Unknown routes — HTTP 404, not 200 + homepage canonical.
[[redirects]]
  from = "/*"
  to = "/.netlify/functions/not-found"
  status = 200
